"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "public"

[dev]
  command = "npm start"
  targetPort = 3000
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/gpu/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ab/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/r.bin"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
